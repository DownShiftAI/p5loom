name: publish

# Runs when a GitHub release is published. Publishing with provenance links the npm package to this workflow run.
# Requires the repository secret NPM_TOKEN (an automation token from npmjs.com).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: the checks must pass before anything is published
        run: |
          npm test
          npm run test:docs
      - name: the package is public from this release on
        run: npm pkg delete private
      - name: check the package contents
        run: npm pack --dry-run
      - name: publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
